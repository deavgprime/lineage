[project]
name = "lineage"
version = "0.0.0"
description = "Cited due-diligence drafting for corporate onboarding at a bank operating in the UK and the UAE."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "defusedxml>=0.7.1",
  "en-core-web-sm",
  "fastapi>=0.115",
  "fastembed==0.9.1",
  "pillow>=13.0.0",
  "presidio-analyzer>=2.2.364",
  "psycopg-pool>=3.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pyjwt[crypto]>=2.9",
  "spacy>=3.8",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-defusedxml>=0.7.0.20260504",
]

[project.scripts]
lineage = "lineage_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/agent/lineage_agent",
  "packages/evals/lineage_evals",
  "packages/db/lineage_db",
  "ingest/lineage_ingest",
  "apps/api/lineage_api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed test secrets and build SQL from fixed table names.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/agent:packages/evals:packages/db:ingest:apps/api:tests/integration"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast tests with no network or database",
  "integration: tests that need Postgres or a recorded external API",
  "eval: model evaluations, run by the eval harness and not by default",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
