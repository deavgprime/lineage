[project]
name = "lineage"
version = "0.0.0"
description = "Cited due-diligence drafting for corporate onboarding at a bank operating in the UK and the UAE."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "psycopg-pool>=3.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
lineage = "lineage_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/agent/lineage_agent",
  "packages/evals/lineage_evals",
  "packages/db/lineage_db",
  "ingest/lineage_ingest",
  "apps/api/lineage_api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/agent:packages/evals:packages/db:ingest:apps/api"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast tests with no network or database",
  "integration: tests that need Postgres or a recorded external API",
  "eval: model evaluations, run by the eval harness and not by default",
]
