# Local services for development and integration tests.
#   docker compose up -d db
#   docker compose up -d --build api
#   docker compose up -d keycloak
#   docker compose up -d --build console
#   docker compose --profile tracing up -d jaeger   (traces at http://localhost:16686)
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage-local
      POSTGRES_DB: lineage
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage -d lineage"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lineage:lineage-local@db:5432/lineage
      OIDC_ISSUER: http://localhost:8080/realms/lineage
      OIDC_JWKS_URL: http://keycloak:8080/realms/lineage/protocol/openid-connect/certs
      # Picked up only when the tracing profile runs Jaeger; otherwise spans go nowhere.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Local sign-in only: development mode, HTTP, and the test realm in infra/keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-test
      # One issuer for tokens from the browser, the tests and other containers.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak/lineage-realm.json:/opt/keycloak/data/import/lineage-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  console:
    build:
      context: apps/console
    environment:
      OIDC_ISSUER: http://localhost:8080/realms/lineage
      OIDC_BACKCHANNEL_URL: http://keycloak:8080
      OIDC_CLIENT_ID: lineage-console
      APP_URL: http://localhost:3000
      LINEAGE_API_URL: http://api:8000
      # Local only. Set a real secret of at least 32 characters anywhere else.
      SESSION_SECRET: local-only-session-secret-change-me-0123456789
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
      - keycloak

  # A local trace viewer. In a deployment, point OTEL_EXPORTER_OTLP_ENDPOINT at Langfuse or the
  # bank's own collector instead.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [tracing]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
