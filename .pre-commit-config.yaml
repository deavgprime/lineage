# Install once:  pre-commit install --hook-type pre-commit --hook-type commit-msg
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are YAML only after rendering; CI lints and schema-checks the output.
        exclude: ^infra/helm/.*/templates/
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/legislation/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/legislation/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      - id: text-style
        name: text style
        entry: scripts/check_text_style.sh
        language: script
        types: [text]
        # Third-party text kept verbatim: the licence and legislation fixtures.
        exclude: ^(LICENSE|tests/fixtures/legislation/.*)$
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        require_serial: true
