# Values for the chart's own tests in CI and on a local kind cluster. Not for a bank.
oidc:
  issuer: http://localhost:8080/realms/lineage
  jwksUrl: http://keycloak:8080/realms/lineage/protocol/openid-connect/certs
consoleUrl: http://localhost:3000
existingSecret: lineage
drafting: fixture
image:
  registry: lineage
  tag: ci
  pullPolicy: Never
# Small requests so everything fits on a two-CPU CI runner next to the test database.
api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
console:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
