version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies, python]
    groups:
      python-dev-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/console
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies]
    # openapi-typescript supports TypeScript 5 only, and ESLint 10 breaks the peer dependencies of
    # eslint-config-next. Move these majors by hand when their dependents catch up.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      console:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/console]
    target-branch: develop
    # Patch and minor updates only: a new Node or Python major, or a non-LTS Node, is moved by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies]
    groups:
      base-images:
        patterns: ["*"]
