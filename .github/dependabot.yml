version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies, python]
    groups:
      python-dev-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/console
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies]
    groups:
      console:
        patterns: ["*"]
