name: Feature request
description: A new capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: The observable result, ideally something a test or eval can check.
    validations:
      required: true
