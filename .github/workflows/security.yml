name: Security

# Runs inside CI on every pull request and push, and on its own every Monday so a new advisory
# against code that has not changed still shows up.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  PIP_AUDIT_VERSION: "2.9.0"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  TRIVY_IMAGE: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 # 0.76.0

jobs:
  secrets:
    name: Secrets in history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every commit on the branch, not just the change, with findings redacted in the log.
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1
      # Secret patterns Trivy knows that gitleaks may not, on the files as they stand.
      - run: >-
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs --quiet --scanners secret
          --exit-code 1 /repo

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Everything in the lock file, runtime and development, against the PyPI advisory database.
      - run: uv export --frozen --no-hashes --no-emit-project > requirements.txt
      - run: uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict -r requirements.txt

  image:
    name: Image and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" config --quiet
          --severity HIGH,CRITICAL --exit-code 1 /repo
      - run: docker build -f apps/api/Dockerfile -t lineage-api:scan .
      # Fixable high and critical advisories in the OS packages and Python packages of the image.
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image
          --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          lineage-api:scan
