name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request supersedes its in-flight run. Pushes to develop
# and main each get their own group, so a batch of merges never leaves an
# intermediate commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.6"
  PRE_COMMIT_VERSION: "4.7.0"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uvx --from "pre-commit==${PRE_COMMIT_VERSION}" pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy packages ingest apps tests

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen --python ${{ matrix.python }} pytest -m "not eval and not integration"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: lineage
          POSTGRES_PASSWORD: lineage-ci
          POSTGRES_DB: lineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lineage -d lineage"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lineage:lineage-ci@localhost:5432/lineage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: docker compose up -d --wait keycloak
      - run: uv run --frozen pytest -m integration

  screening-eval:
    name: Screening eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: lineage
          POSTGRES_PASSWORD: lineage-ci
          POSTGRES_DB: lineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lineage -d lineage"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lineage:lineage-ci@localhost:5432/lineage
      DATA_DIR: ${{ github.workspace }}/.opensanctions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The key changes only when the pins change, and the fetch step checks
      # every file against its pinned checksum, so a cache entry cannot change
      # what the eval loads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opensanctions
          key: opensanctions-${{ hashFiles('ingest/lineage_ingest/fetch.py') }}
      - run: uv run --frozen python -m lineage_ingest.fetch "$DATA_DIR"
      - run: uv run --frozen python -m lineage_db.migrate
      - run: >-
          uv run --frozen python -m lineage_ingest.opensanctions
          --sanctions "$DATA_DIR/sanctions.csv" --peps "$DATA_DIR/peps.csv"
          --version "$(cat "$DATA_DIR/version.txt")"
      - run: uv run --frozen python -m lineage_evals.run_screening --out "$RUNNER_TEMP/screening.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-screening
          path: ${{ runner.temp }}/screening.json
          if-no-files-found: ignore
          retention-days: 7

  ownership-eval:
    name: Ownership eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Calls the live register. Dependabot pull requests cannot read Actions
      # secrets, so they skip the eval and say so in the log.
      - env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          if [ -z "$COMPANIES_HOUSE_API_KEY" ]; then
            echo "::warning::COMPANIES_HOUSE_API_KEY is not available, ownership eval skipped"
            exit 0
          fi
          uv run --frozen python -m lineage_evals.run_ownership --out "$RUNNER_TEMP/ownership.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ownership
          path: ${{ runner.temp }}/ownership.json
          if-no-files-found: ignore
          retention-days: 7

  api-image:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile -t lineage-api:ci .
      - run: |
          docker run --rm lineage-api:ci python -c "import lineage_api.app, lineage_agent.agent"

  security:
    name: Security
    uses: $/.github/workflows/security.yml

  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: npm ci --no-audit --no-fund
      # The typed client must match the API. Regenerate both and fail on any difference.
      - name: Check the API client is current
        run: |
          uv run --frozen python -m lineage_api.openapi > openapi.json
          npm run -s gen:api
          git diff --exit-code -- openapi.json src/lib/api-types.ts
      - run: npm run -s lint
      - run: npm run -s typecheck
      - run: npm test
      - run: npm run -s build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OIDC_ISSUER: http://localhost:8080/realms/lineage
      OIDC_CLIENT_ID: lineage-console
      APP_URL: http://localhost:3000
      LINEAGE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The API drafts from fixtures here, so the run needs no model or register access.
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait db keycloak api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - working-directory: apps/console
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run -s build
      - name: Start the console
        working-directory: apps/console
        run: |
          SESSION_SECRET="$(openssl rand -base64 32)" PORT=3000 HOSTNAME=127.0.0.1 \
            nohup node .next/standalone/server.js > console.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/auth/login && exit 0; sleep 1; done
          cat console.log; exit 1
      - working-directory: apps/console
        run: npm run -s e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/console/playwright-report
            apps/console/test-results
            apps/console/console.log
          retention-days: 7
      - if: failure()
        run: docker compose logs api keycloak | tail -200

  # Posts the eval scores next to the base branch's baselines as one comment
  # that is updated on every run. It reports and does not gate.
  eval-report:
    name: Eval report
    if: always() && github.event_name == 'pull_request'
    needs: [screening-eval, ownership-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-*
          path: current
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: |
          cp packages/evals/baselines/citations.json packages/evals/baselines/safety.json current/ 2>/dev/null || true
          uv run --frozen python -m lineage_evals.report \
            --current current --baseline base/packages/evals/baselines > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- lineage-evals -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@report.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@report.md >/dev/null
          fi

  # One status for the branch rules to require. It fails if any job above
  # failed, was cancelled or was skipped.
  gate:
    name: CI gate
    if: always()
    needs: [pre-commit, lint, test, integration, screening-eval, ownership-eval, api-image, security, console, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done
