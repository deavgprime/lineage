# A throwaway Postgres with pgvector for installing the chart on a local kind cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # Hardened like the chart's own pods, so the test database passes the same config scan.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.1-pg17
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          env:
            - { name: POSTGRES_USER, value: lineage }
            - { name: POSTGRES_PASSWORD, value: lineage-kind }
            - { name: POSTGRES_DB, value: lineage }
            # A subdirectory Postgres creates itself, since it cannot change the mount's permissions.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lineage"] }
            periodSeconds: 2
          resources:
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: lineage
stringData:
  DATABASE_URL: postgresql://lineage:lineage-kind@postgres:5432/lineage
  SESSION_SECRET: kind-only-session-secret-0123456789abcdef
